  <text x="416" y="42" text-anchor="end" class="mono" font-size="12.5" fill="#737aa2">since 2020 · incl. private</text>
  <g class="fade" style="animation-delay:0.10s"><text x="24.0" y="108" class="sans" font-size="31" font-weight="700" fill="#7aa2f7">1.5k</text><text x="24.0" y="131" class="mono" font-size="12.5" letter-spacing=".3" fill="#737aa2">COMMITS</text></g>
  <g class="fade" style="animation-delay:0.18s"><text x="154.7" y="108" class="sans" font-size="31" font-weight="700" fill="#7dcfff">1.6k</text><text x="154.7" y="131" class="mono" font-size="12.5" letter-spacing=".3" fill="#737aa2">CONTRIBUTIONS</text></g>
  <g class="fade" style="animation-delay:0.26s"><text x="285.3" y="108" class="sans" font-size="31" font-weight="700" fill="#bb9af7">37</text><text x="285.3" y="131" class="mono" font-size="12.5" letter-spacing=".3" fill="#737aa2">REPOSITORIES</text></g>
  <g class="fade" style="animation-delay:0.34s"><text x="24.0" y="182" class="sans" font-size="31" font-weight="700" fill="#9ece6a">6<tspan font-size="15" font-weight="400" fill="#737aa2"> days</tspan></text><text x="24.0" y="205" class="mono" font-size="12.5" letter-spacing=".3" fill="#737aa2">CURRENT STREAK</text></g>
  <g class="fade" style="animation-delay:0.42s"><text x="154.7" y="182" class="sans" font-size="31" font-weight="700" fill="#ff9e64">15<tspan font-size="15" font-weight="400" fill="#737aa2"> days</tspan></text><text x="154.7" y="205" class="mono" font-size="12.5" letter-spacing=".3" fill="#737aa2">LONGEST STREAK</text></g>
  <g class="fade" style="animation-delay:0.50s"><text x="285.3" y="182" class="sans" font-size="31" font-weight="700" fill="#e0af68">2020</text><text x="285.3" y="205" class="mono" font-size="12.5" letter-spacing=".3" fill="#737aa2">CODING SINCE</text></g>
