<svg xmlns="http://www.w3.org/2000/svg" width="452" height="236" viewBox="-6 -6 452 236" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Activity</title>
  <desc id="desc">Commits: 1.5k, Contributions: 1.6k, Repositories: 37, Current streak: 6 days, Longest streak: 15 days, Coding since: 2020</desc>
  <style>
    .sans { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, monospace; }
    /* visible by default; the animation only plays the entrance, so static renderers still show everything */
    .fade { animation: fade .5s ease-out backwards; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x=".5" y=".5" width="439" height="223" rx="14" fill="#1a1b27" stroke="#292e42"/>
