<svg xmlns="http://www.w3.org/2000/svg" width="452" height="292" viewBox="-6 -6 452 292" role="img" aria-labelledby="title desc">
  <title id="title">Hellroom</title>
  <desc id="desc">Team of 5 · C++20 / SFML · 2023. Top-down bullet hell where every room locks you in until its enemies are dead. I built the enemy A* pathfinding and the camera.</desc>
  <defs>
    <clipPath id="frame"><rect width="440" height="280" rx="14"/></clipPath>
    <radialGradient id="glow" cx="0" cy="0" r=".9"><stop offset="0" stop-color="#bb9af7" stop-opacity=".16"/><stop offset="1" stop-color="#bb9af7" stop-opacity="0"/></radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f7768e"/><stop offset="1" stop-color="#ff9e64"/></linearGradient>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, monospace; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }

    .eq { transform-box: fill-box; transform-origin: bottom; animation: eq 1.1s ease-in-out infinite alternate; }
    @keyframes eq { 0% { transform: scaleY(.25); } 100% { transform: scaleY(1); } }
    .bounce { animation: bounce 1.2s ease-in-out infinite alternate; }
    @keyframes bounce { to { transform: translateY(18px); } }
    .flicker { transform-box: fill-box; transform-origin: bottom; animation: flicker .9s ease-in-out infinite alternate; }
    @keyframes flicker { 0% { transform: scale(1, 1); } 100% { transform: scale(.94, 1.08); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="440" height="280" fill="#1a1b27"/>
    <rect width="440" height="280" fill="url(#glow)"/>
    <g transform="translate(22,20) scale(1.1)">
      <rect width="40" height="40" rx="10" fill="#bb9af7" fill-opacity=".10" stroke="#bb9af7" stroke-opacity=".35"/>
      <path d="M9 33V15a11 11 0 0 1 22 0v18" fill="none" stroke="#bb9af7" stroke-width="2" stroke-opacity=".7"/>
      <g class="pulse"><path d="M20 10l2.2 7.8L30 20l-7.8 2.2L20 30l-2.2-7.8L10 20l7.8-2.2Z" fill="#7dcfff"/><circle cx="20" cy="20" r="2" fill="#1a1b27"/></g>
    </g>
    <rect x="256.5" y="28" width="161.5" height="28" rx="14" fill="#7dcfff" fill-opacity=".10" stroke="#7dcfff" stroke-opacity=".45"/>
    <path d="M268.5 37l9 5-9 5Z" fill="#7dcfff"/>
    <text x="285.5" y="46.5" class="mono" font-size="12.5" letter-spacing=".6" fill="#7dcfff">PLAY ON ITCH.IO</text>
    <text x="24" y="110" class="sans" font-size="27" font-weight="700" fill="#c0caf5">Hellroom</text>
    <text x="24" y="136" class="mono" font-size="14" fill="#737aa2">Team of 5 · C++20 / SFML · 2023</text>
    <text x="24" y="172" class="sans" font-size="16.5" fill="#a9b1d6">Top-down bullet hell where every room locks</text><text x="24" y="197" class="sans" font-size="16.5" fill="#a9b1d6">you in until its enemies are dead. I built</text><text x="24" y="222" class="sans" font-size="16.5" fill="#a9b1d6">the enemy A* pathfinding and the camera.</text>
    <rect x="24.0" y="238" width="55.4" height="28" rx="14" fill="#c0caf5" fill-opacity=".04" stroke="#292e42"/><circle cx="38.0" cy="252" r="4.5" fill="#f34b7d"/><text x="48.0" y="256.5" class="mono" font-size="13" fill="#a9b1d6">C++</text><rect x="87.4" y="238" width="63.2" height="28" rx="14" fill="#c0caf5" fill-opacity=".04" stroke="#292e42"/><circle cx="101.4" cy="252" r="4.5" fill="#8CC445"/><text x="111.4" y="256.5" class="mono" font-size="13" fill="#a9b1d6">SFML</text><rect x="158.6" y="238" width="55.4" height="28" rx="14" fill="#c0caf5" fill-opacity=".04" stroke="#292e42"/><circle cx="172.6" cy="252" r="4.5" fill="#bb9af7"/><text x="182.6" y="256.5" class="mono" font-size="13" fill="#a9b1d6">ECS</text><rect x="222.0" y="238" width="141.2" height="28" rx="14" fill="#c0caf5" fill-opacity=".04" stroke="#292e42"/><circle cx="236.0" cy="252" r="4.5" fill="#7dcfff"/><text x="246.0" y="256.5" class="mono" font-size="13" fill="#a9b1d6">A* pathfinding</text>
  </g>
  <rect x=".5" y=".5" width="439" height="279" rx="13.5" fill="none" stroke="#292e42"/>
</svg>
