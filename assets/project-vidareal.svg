    <text x="28" y="102" class="sans" font-size="24" font-weight="700" fill="#c0caf5">Vidareal</text>
    <text x="28" y="126" class="mono" font-size="13" fill="#737aa2">vidareal.es · VR for elderly care</text>
    <text x="28" y="162" class="sans" font-size="15.5" fill="#a9b1d6">VR cognitive-stimulation platform for elderly care on</text><text x="28" y="186" class="sans" font-size="15.5" fill="#a9b1d6">Meta Quest &amp; Pico: real-time control of multiple</text><text x="28" y="210" class="sans" font-size="15.5" fill="#a9b1d6">headsets from a phone, with video streamed via Mux.</text>
    <rect x="28.0" y="226" width="83.8" height="26" rx="13" fill="#c0caf5" fill-opacity=".04" stroke="#292e42"/><circle cx="42.0" cy="239" r="4" fill="#EF2D5E"/><text x="52.0" y="243.5" class="mono" font-size="12" fill="#a9b1d6">A-Frame</text><rect x="119.8" y="226" width="106.0" height="26" rx="13" fill="#c0caf5" fill-opacity=".04" stroke="#292e42"/><circle cx="133.8" cy="239" r="4" fill="#7dcfff"/><text x="143.8" y="243.5" class="mono" font-size="12" fill="#a9b1d6">WebSockets</text><rect x="233.8" y="226" width="54.2" height="26" rx="13" fill="#c0caf5" fill-opacity=".04" stroke="#292e42"/><circle cx="247.8" cy="239" r="4" fill="#FA50B5"/><text x="257.8" y="243.5" class="mono" font-size="12" fill="#a9b1d6">Mux</text><rect x="296.0" y="226" width="106.0" height="26" rx="13" fill="#c0caf5" fill-opacity=".04" stroke="#292e42"/><circle cx="310.0" cy="239" r="4" fill="#ff9e64"/><text x="320.0" y="243.5" class="mono" font-size="12" fill="#a9b1d6">Bun + Hono</text>
