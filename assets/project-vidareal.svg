<svg xmlns="http://www.w3.org/2000/svg" width="520" height="272" viewBox="0 0 520 272" role="img" aria-labelledby="title desc">
  <title id="title">Vidareal</title>
  <desc id="desc">vidareal.es · VR for elderly care. VR cognitive-stimulation platform for elderly care on Meta Quest &amp; Pico: real-time control of multiple headsets from a phone, with video streamed via Mux.</desc>
  <defs>
    <clipPath id="frame"><rect width="520" height="272" rx="14"/></clipPath>
    <radialGradient id="glow" cx="0" cy="0" r=".9"><stop offset="0" stop-color="#7dcfff" stop-opacity=".16"/><stop offset="1" stop-color="#7dcfff" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, monospace; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }

    .eq { transform-box: fill-box; transform-origin: bottom; animation: eq 1.1s ease-in-out infinite alternate; }
    @keyframes eq { 0% { transform: scaleY(.25); } 100% { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="520" height="272" fill="#1a1b27"/>
    <rect width="520" height="272" fill="url(#glow)"/>
    <g transform="translate(24,20)">
      <rect width="40" height="40" rx="10" fill="#7dcfff" fill-opacity=".10" stroke="#7dcfff" stroke-opacity=".35"/>
      <path d="M9 13h22a5 5 0 0 1 5 5v5a5 5 0 0 1-5 5h-6l-3-4h-4l-3 4H9a5 5 0 0 1-5-5v-5a5 5 0 0 1 5-5Z" fill="none" stroke="#7dcfff" stroke-width="2.2" stroke-linejoin="round"/>
      <circle class="pulse" cx="13.5" cy="20.5" r="3" fill="#7dcfff"/><circle class="pulse" style="animation-delay:.3s" cx="26.5" cy="20.5" r="3" fill="#7dcfff"/>
    </g>
    <rect x="363.8" y="25" width="132.2" height="24" rx="12" fill="#9ece6a" fill-opacity=".10" stroke="#9ece6a" stroke-opacity=".45"/>
    <circle class="pulse" cx="378.8" cy="37" r="4" fill="#9ece6a"/>
