<svg xmlns="http://www.w3.org/2000/svg" width="520" height="272" viewBox="0 0 520 272" role="img" aria-labelledby="title desc">
  <title id="title">Box Beats</title>
  <desc id="desc">BSc thesis · VR rhythm game. Beat Saber-inspired VR rhythm game: punch blocks to the beat, with punching bag and speed ball modes and a global per-level leaderboard.</desc>
  <defs>
    <clipPath id="frame"><rect width="520" height="272" rx="14"/></clipPath>
    <radialGradient id="glow" cx="0" cy="0" r=".9"><stop offset="0" stop-color="#ff9e64" stop-opacity=".16"/><stop offset="1" stop-color="#ff9e64" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, monospace; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }

    .eq { transform-box: fill-box; transform-origin: bottom; animation: eq 1.1s ease-in-out infinite alternate; }
    @keyframes eq { 0% { transform: scaleY(.25); } 100% { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="520" height="272" fill="#1a1b27"/>
    <rect width="520" height="272" fill="url(#glow)"/>
    <g transform="translate(24,20)">
      <rect width="40" height="40" rx="10" fill="#ff9e64" fill-opacity=".10" stroke="#ff9e64" stroke-opacity=".35"/>
      <rect class="eq" style="animation-delay:0s" x="8" y="9" width="4" height="22" rx="2" fill="#ff9e64"/><rect class="eq" style="animation-delay:0.25s" x="14" y="9" width="4" height="22" rx="2" fill="#f7768e"/><rect class="eq" style="animation-delay:0.5s" x="20" y="9" width="4" height="22" rx="2" fill="#ff9e64"/><rect class="eq" style="animation-delay:0.15s" x="26" y="9" width="4" height="22" rx="2" fill="#f7768e"/><rect class="eq" style="animation-delay:0.4s" x="32" y="9" width="4" height="22" rx="2" fill="#ff9e64"/>
    </g>
    <rect x="386.0" y="25" width="110.0" height="24" rx="12" fill="#e0af68" fill-opacity=".10" stroke="#e0af68" stroke-opacity=".45"/>
    <path transform="translate(401.0,37) scale(.6) translate(-8,-8.4)" d="M8 0l2.4 5 5.6.8-4 3.9 1 5.5L8 12.6 3 15.2l1-5.5-4-3.9L5.6 5Z" fill="#e0af68"/>
    <text x="412.0" y="41" class="mono" font-size="11" letter-spacing=".8" fill="#e0af68">GRADE 9/10</text>
    <text x="28" y="102" class="sans" font-size="24" font-weight="700" fill="#c0caf5">Box Beats</text>
    <text x="28" y="126" class="mono" font-size="13" fill="#737aa2">BSc thesis · VR rhythm game</text>
    <text x="28" y="162" class="sans" font-size="15.5" fill="#a9b1d6">Beat Saber-inspired VR rhythm game: punch blocks</text><text x="28" y="186" class="sans" font-size="15.5" fill="#a9b1d6">to the beat, with punching bag and speed ball modes</text><text x="28" y="210" class="sans" font-size="15.5" fill="#a9b1d6">and a global per-level leaderboard.</text>
    <rect x="28.0" y="226" width="143.0" height="26" rx="13" fill="#c0caf5" fill-opacity=".04" stroke="#292e42"/><circle cx="42.0" cy="239" r="4" fill="#c0caf5"/><text x="52.0" y="243.5" class="mono" font-size="12" fill="#a9b1d6">Unreal Engine 5</text><rect x="179.0" y="226" width="46.8" height="26" rx="13" fill="#c0caf5" fill-opacity=".04" stroke="#292e42"/><circle cx="193.0" cy="239" r="4" fill="#bb9af7"/><text x="203.0" y="243.5" class="mono" font-size="12" fill="#a9b1d6">VR</text><rect x="233.8" y="226" width="91.2" height="26" rx="13" fill="#c0caf5" fill-opacity=".04" stroke="#292e42"/><circle cx="247.8" cy="239" r="4" fill="#7dcfff"/><text x="257.8" y="243.5" class="mono" font-size="12" fill="#a9b1d6">REST API</text><rect x="333.0" y="226" width="113.4" height="26" rx="13" fill="#c0caf5" fill-opacity=".04" stroke="#292e42"/><circle cx="347.0" cy="239" r="4" fill="#9ece6a"/><text x="357.0" y="243.5" class="mono" font-size="12" fill="#a9b1d6">Self-hosted</text>
  </g>
  <rect x=".5" y=".5" width="519" height="271" rx="13.5" fill="none" stroke="#292e42"/>
</svg>
