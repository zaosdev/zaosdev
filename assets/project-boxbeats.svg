<svg xmlns="http://www.w3.org/2000/svg" width="452" height="292" viewBox="-6 -6 452 292" role="img" aria-labelledby="title desc">
  <title id="title">Box Beats</title>
  <desc id="desc">BSc thesis · VR rhythm game. Beat Saber-inspired VR rhythm game: punch blocks to the beat, with punching bag and speed ball modes and a global leaderboard.</desc>
  <defs>
    <clipPath id="frame"><rect width="440" height="280" rx="14"/></clipPath>
    <radialGradient id="glow" cx="0" cy="0" r=".9"><stop offset="0" stop-color="#ff9e64" stop-opacity=".16"/><stop offset="1" stop-color="#ff9e64" stop-opacity="0"/></radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f7768e"/><stop offset="1" stop-color="#ff9e64"/></linearGradient>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, monospace; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }

    .eq { transform-box: fill-box; transform-origin: bottom; animation: eq 1.1s ease-in-out infinite alternate; }
    @keyframes eq { 0% { transform: scaleY(.25); } 100% { transform: scaleY(1); } }
    .bounce { animation: bounce 1.2s ease-in-out infinite alternate; }
    @keyframes bounce { to { transform: translateY(18px); } }
    .flicker { transform-box: fill-box; transform-origin: bottom; animation: flicker .9s ease-in-out infinite alternate; }
    @keyframes flicker { 0% { transform: scale(1, 1); } 100% { transform: scale(.94, 1.08); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="440" height="280" fill="#1a1b27"/>
    <rect width="440" height="280" fill="url(#glow)"/>
    <g transform="translate(22,20) scale(1.1)">
      <rect width="40" height="40" rx="10" fill="#ff9e64" fill-opacity=".10" stroke="#ff9e64" stroke-opacity=".35"/>
      <rect class="eq" style="animation-delay:0s" x="8" y="9" width="4" height="22" rx="2" fill="#ff9e64"/><rect class="eq" style="animation-delay:0.25s" x="14" y="9" width="4" height="22" rx="2" fill="#f7768e"/><rect class="eq" style="animation-delay:0.5s" x="20" y="9" width="4" height="22" rx="2" fill="#ff9e64"/><rect class="eq" style="animation-delay:0.15s" x="26" y="9" width="4" height="22" rx="2" fill="#f7768e"/><rect class="eq" style="animation-delay:0.4s" x="32" y="9" width="4" height="22" rx="2" fill="#ff9e64"/>
    </g>
    <rect x="297.0" y="28" width="121.0" height="28" rx="14" fill="#e0af68" fill-opacity=".10" stroke="#e0af68" stroke-opacity=".45"/>
    <path transform="translate(313.0,42) scale(.7) translate(-8,-8.4)" d="M8 0l2.4 5 5.6.8-4 3.9 1 5.5L8 12.6 3 15.2l1-5.5-4-3.9L5.6 5Z" fill="#e0af68"/>
    <text x="326.0" y="46.5" class="mono" font-size="12.5" letter-spacing=".6" fill="#e0af68">GRADE 9/10</text>
    <text x="24" y="110" class="sans" font-size="27" font-weight="700" fill="#c0caf5">Box Beats</text>
    <text x="24" y="136" class="mono" font-size="14" fill="#737aa2">BSc thesis · VR rhythm game</text>
    <text x="24" y="172" class="sans" font-size="16.5" fill="#a9b1d6">Beat Saber-inspired VR rhythm game: punch</text><text x="24" y="197" class="sans" font-size="16.5" fill="#a9b1d6">blocks to the beat, with punching bag and</text><text x="24" y="222" class="sans" font-size="16.5" fill="#a9b1d6">speed ball modes and a global leaderboard.</text>
    <rect x="24.0" y="238" width="149.0" height="28" rx="14" fill="#c0caf5" fill-opacity=".04" stroke="#292e42"/><circle cx="38.0" cy="252" r="4.5" fill="#c0caf5"/><text x="48.0" y="256.5" class="mono" font-size="13" fill="#a9b1d6">Unreal Engine 5</text><rect x="181.0" y="238" width="47.6" height="28" rx="14" fill="#c0caf5" fill-opacity=".04" stroke="#292e42"/><circle cx="195.0" cy="252" r="4.5" fill="#bb9af7"/><text x="205.0" y="256.5" class="mono" font-size="13" fill="#a9b1d6">VR</text><rect x="236.6" y="238" width="94.4" height="28" rx="14" fill="#c0caf5" fill-opacity=".04" stroke="#292e42"/><circle cx="250.6" cy="252" r="4.5" fill="#7dcfff"/><text x="260.6" y="256.5" class="mono" font-size="13" fill="#a9b1d6">REST API</text>
  </g>
  <rect x=".5" y=".5" width="439" height="279" rx="13.5" fill="none" stroke="#292e42"/>
</svg>
