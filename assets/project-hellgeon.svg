<svg xmlns="http://www.w3.org/2000/svg" width="452" height="292" viewBox="-6 -6 452 292" role="img" aria-labelledby="title desc">
  <title id="title">Hellgeon</title>
  <desc id="desc">Team of 5 · built before AI assistants. Low-poly 3D bullet hell built from scratch over a full year: our own C++ / OpenGL engine, gameplay, 3D models and audio.</desc>
  <defs>
    <clipPath id="frame"><rect width="440" height="280" rx="14"/></clipPath>
    <radialGradient id="glow" cx="0" cy="0" r=".9"><stop offset="0" stop-color="#f7768e" stop-opacity=".16"/><stop offset="1" stop-color="#f7768e" stop-opacity="0"/></radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f7768e"/><stop offset="1" stop-color="#ff9e64"/></linearGradient>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, monospace; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }

    .eq { transform-box: fill-box; transform-origin: bottom; animation: eq 1.1s ease-in-out infinite alternate; }
    @keyframes eq { 0% { transform: scaleY(.25); } 100% { transform: scaleY(1); } }
    .bounce { animation: bounce 1.2s ease-in-out infinite alternate; }
    @keyframes bounce { to { transform: translateY(18px); } }
    .flicker { transform-box: fill-box; transform-origin: bottom; animation: flicker .9s ease-in-out infinite alternate; }
    @keyframes flicker { 0% { transform: scale(1, 1); } 100% { transform: scale(.94, 1.08); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="440" height="280" fill="#1a1b27"/>
    <rect width="440" height="280" fill="url(#glow)"/>
    <g transform="translate(22,20) scale(1.1)">
      <rect width="40" height="40" rx="10" fill="#f7768e" fill-opacity=".10" stroke="#f7768e" stroke-opacity=".35"/>
      <path class="flicker" d="M20 6c1.5 5 9 8.5 9 17a9 9 0 0 1-18 0c0-4.5 2.5-7 4-9 .6 3 2 4.5 4 5-1.2-4.6-.6-9.2 1-13Z" fill="url(#flame)"/>
      <path class="flicker" style="animation-delay:-.4s" d="M20 19c1 2.6 4 4 4 7.5a4 4 0 0 1-8 0c0-2 1-3.2 2-4.2.4 1.2 1 1.8 2 2-.5-1.8-.4-3.6 0-5.3Z" fill="#e0af68"/>
    </g>
    <rect x="240.3" y="28" width="177.7" height="28" rx="14" fill="#ff9e64" fill-opacity=".10" stroke="#ff9e64" stroke-opacity=".45"/>
    <path d="M252.3 37l9 5-9 5Z" fill="#ff9e64"/>
    <text x="269.3" y="46.5" class="mono" font-size="12.5" letter-spacing=".6" fill="#ff9e64">YEAR-LONG PROJECT</text>
    <text x="24" y="110" class="sans" font-size="27" font-weight="700" fill="#c0caf5">Hellgeon</text>
    <text x="24" y="136" class="mono" font-size="14" fill="#737aa2">Team of 5 · built before AI assistants</text>
    <text x="24" y="172" class="sans" font-size="16.5" fill="#a9b1d6">Low-poly 3D bullet hell built from scratch</text><text x="24" y="197" class="sans" font-size="16.5" fill="#a9b1d6">over a full year: our own C++ / OpenGL</text><text x="24" y="222" class="sans" font-size="16.5" fill="#a9b1d6">engine, gameplay, 3D models and audio.</text>
    <rect x="24.0" y="238" width="55.4" height="28" rx="14" fill="#c0caf5" fill-opacity=".04" stroke="#292e42"/><circle cx="38.0" cy="252" r="4.5" fill="#f34b7d"/><text x="48.0" y="256.5" class="mono" font-size="13" fill="#a9b1d6">C++</text><rect x="87.4" y="238" width="78.8" height="28" rx="14" fill="#c0caf5" fill-opacity=".04" stroke="#292e42"/><circle cx="101.4" cy="252" r="4.5" fill="#5586A4"/><text x="111.4" y="256.5" class="mono" font-size="13" fill="#a9b1d6">OpenGL</text><rect x="174.2" y="238" width="86.6" height="28" rx="14" fill="#c0caf5" fill-opacity=".04" stroke="#292e42"/><circle cx="188.2" cy="252" r="4.5" fill="#F5792A"/><text x="198.2" y="256.5" class="mono" font-size="13" fill="#a9b1d6">Blender</text><rect x="268.8" y="238" width="117.8" height="28" rx="14" fill="#c0caf5" fill-opacity=".04" stroke="#292e42"/><circle cx="282.8" cy="252" r="4.5" fill="#c0caf5"/><text x="292.8" y="256.5" class="mono" font-size="13" fill="#a9b1d6">Win + Linux</text>
  </g>
  <rect x=".5" y=".5" width="439" height="279" rx="13.5" fill="none" stroke="#292e42"/>
</svg>
