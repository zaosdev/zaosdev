    <text x="24" y="172" class="sans" font-size="16.5" fill="#a9b1d6">Neural network architectures for stock</text><text x="24" y="197" class="sans" font-size="16.5" fill="#a9b1d6">price prediction, trained on large-scale</text><text x="24" y="222" class="sans" font-size="16.5" fill="#a9b1d6">historical time series and benchmarked.</text>
