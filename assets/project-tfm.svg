      <polyline points="6,30 13,24 20,26 27,17 35,9" fill="none" stroke="#bb9af7" stroke-width="1.6" stroke-dasharray="2 2.5"/>
    </g>
    <rect x="378.6" y="25" width="117.4" height="24" rx="12" fill="#e0af68" fill-opacity=".10" stroke="#e0af68" stroke-opacity=".45"/>
    <path transform="translate(393.6,37) scale(.6) translate(-8,-8.4)" d="M8 0l2.4 5 5.6.8-4 3.9 1 5.5L8 12.6 3 15.2l1-5.5-4-3.9L5.6 5Z" fill="#e0af68"/>
    <text x="404.6" y="41" class="mono" font-size="11" letter-spacing=".8" fill="#e0af68">GRADE 10/10</text>
    <text x="28" y="102" class="sans" font-size="24" font-weight="700" fill="#c0caf5">Deep Learning for Markets</text>
    <text x="28" y="126" class="mono" font-size="13" fill="#737aa2">MSc thesis · University of Alicante</text>
    <text x="28" y="162" class="sans" font-size="15.5" fill="#a9b1d6">Neural network architectures for stock price</text><text x="28" y="186" class="sans" font-size="15.5" fill="#a9b1d6">prediction, trained on large-scale historical time</text><text x="28" y="210" class="sans" font-size="15.5" fill="#a9b1d6">series and benchmarked against each other.</text>
