    <path transform="translate(304.9,42) scale(.7) translate(-8,-8.4)" d="M8 0l2.4 5 5.6.8-4 3.9 1 5.5L8 12.6 3 15.2l1-5.5-4-3.9L5.6 5Z" fill="#e0af68"/>
    <text x="317.9" y="46.5" class="mono" font-size="12.5" letter-spacing=".6" fill="#e0af68">GRADE 10/10</text>
    <text x="24" y="110" class="sans" font-size="27" font-weight="700" fill="#c0caf5">Deep Learning for Markets</text>
