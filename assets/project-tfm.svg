<svg xmlns="http://www.w3.org/2000/svg" width="520" height="272" viewBox="0 0 520 272" role="img" aria-labelledby="title desc">
  <title id="title">Deep Learning for Markets</title>
  <desc id="desc">MSc thesis · University of Alicante. Neural network architectures for stock price prediction, trained on large-scale historical time series and benchmarked against each other.</desc>
  <defs>
    <clipPath id="frame"><rect width="520" height="272" rx="14"/></clipPath>
    <radialGradient id="glow" cx="0" cy="0" r=".9"><stop offset="0" stop-color="#bb9af7" stop-opacity=".16"/><stop offset="1" stop-color="#bb9af7" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, monospace; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }

    .eq { transform-box: fill-box; transform-origin: bottom; animation: eq 1.1s ease-in-out infinite alternate; }
    @keyframes eq { 0% { transform: scaleY(.25); } 100% { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="520" height="272" fill="#1a1b27"/>
    <rect width="520" height="272" fill="url(#glow)"/>
    <g transform="translate(24,20)">
      <rect width="40" height="40" rx="10" fill="#bb9af7" fill-opacity=".10" stroke="#bb9af7" stroke-opacity=".35"/>
      <g stroke-width="1.6"><line x1="10" y1="11" x2="10" y2="31" stroke="#9ece6a"/><line x1="17" y1="8" x2="17" y2="25" stroke="#f7768e"/><line x1="24" y1="14" x2="24" y2="32" stroke="#9ece6a"/><line x1="31" y1="6" x2="31" y2="22" stroke="#9ece6a"/></g>
