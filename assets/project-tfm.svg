      <g stroke-width="1.6"><line x1="10" y1="11" x2="10" y2="31" stroke="#9ece6a"/><line x1="17" y1="8" x2="17" y2="25" stroke="#f7768e"/><line x1="24" y1="14" x2="24" y2="32" stroke="#9ece6a"/><line x1="31" y1="6" x2="31" y2="22" stroke="#9ece6a"/></g>
