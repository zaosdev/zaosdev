<svg xmlns="http://www.w3.org/2000/svg" width="452" height="292" viewBox="-6 -6 452 292" role="img" aria-labelledby="title desc">
  <title id="title">Stock Control</title>
  <desc id="desc">Inventory app · internship tutor. Mobile inventory app with secure logins. I reviewed the interns&#x27; PRs as their tutor, then rebuilt most of it in the final phase.</desc>
  <defs>
