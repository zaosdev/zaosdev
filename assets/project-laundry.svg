    <text x="24" y="172" class="sans" font-size="16.5" fill="#a9b1d6">Mobile app to control bed linen and laundry</text><text x="24" y="197" class="sans" font-size="16.5" fill="#a9b1d6">day by day. I reviewed the interns&#x27; PRs as</text><text x="24" y="222" class="sans" font-size="16.5" fill="#a9b1d6">their tutor, then led the final rework.</text>
