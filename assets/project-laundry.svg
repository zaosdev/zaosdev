      <circle cx="20" cy="22" r="7" fill="none" stroke="#7aa2f7" stroke-width="2"/>
      <path class="pulse" d="M14.5 23c2-2 4 2 6 0s4 2 5.5 0" fill="none" stroke="#7dcfff" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <rect x="264.6" y="28" width="153.4" height="28" rx="14" fill="#7aa2f7" fill-opacity=".10" stroke="#7aa2f7" stroke-opacity=".45"/>
    <path d="M277.6 41v-2.5a3 3 0 0 1 6 0V41" fill="none" stroke="#7aa2f7" stroke-width="1.6"/><rect x="275.6" y="41" width="10" height="7" rx="1.5" fill="#7aa2f7"/>
    <text x="293.6" y="46.5" class="mono" font-size="12.5" letter-spacing=".6" fill="#7aa2f7">CLIENT PROJECT</text>
