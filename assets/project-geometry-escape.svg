<svg xmlns="http://www.w3.org/2000/svg" width="452" height="292" viewBox="-6 -6 452 292" role="img" aria-labelledby="title desc">
  <title id="title">Geometry Escape</title>
  <desc id="desc">Amstrad CPC · gameplay &amp; graphics. Arcade escape game for the 1984 Amstrad CPC, written in Z80 assembly for a 4 MHz CPU and 64 KB of RAM. Runs on real hardware.</desc>
  <defs>
    <clipPath id="frame"><rect width="440" height="280" rx="14"/></clipPath>
    <radialGradient id="glow" cx="0" cy="0" r=".9"><stop offset="0" stop-color="#9ece6a" stop-opacity=".16"/><stop offset="1" stop-color="#9ece6a" stop-opacity="0"/></radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f7768e"/><stop offset="1" stop-color="#ff9e64"/></linearGradient>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, monospace; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }

    .eq { transform-box: fill-box; transform-origin: bottom; animation: eq 1.1s ease-in-out infinite alternate; }
    @keyframes eq { 0% { transform: scaleY(.25); } 100% { transform: scaleY(1); } }
    .bounce { animation: bounce 1.2s ease-in-out infinite alternate; }
    @keyframes bounce { to { transform: translateY(18px); } }
    .flicker { transform-box: fill-box; transform-origin: bottom; animation: flicker .9s ease-in-out infinite alternate; }
    @keyframes flicker { 0% { transform: scale(1, 1); } 100% { transform: scale(.94, 1.08); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="440" height="280" fill="#1a1b27"/>
    <rect width="440" height="280" fill="url(#glow)"/>
    <g transform="translate(22,20) scale(1.1)">
      <rect width="40" height="40" rx="10" fill="#9ece6a" fill-opacity=".10" stroke="#9ece6a" stroke-opacity=".35"/>
      <rect x="31" y="7" width="5" height="26" rx="1" fill="#9ece6a" fill-opacity=".55"/>
      <rect x="5" y="23" width="8" height="8" rx="1" fill="#e0af68"/>
      <rect class="bounce" x="15" y="8" width="6" height="6" rx="1" fill="#f7768e"/>
      <rect class="bounce" style="animation-delay:-.6s" x="23" y="8" width="6" height="6" rx="1" fill="#7dcfff"/>
    </g>
    <rect x="248.4" y="28" width="169.6" height="28" rx="14" fill="#9ece6a" fill-opacity=".10" stroke="#9ece6a" stroke-opacity=".45"/>
    <path d="M260.4 37l9 5-9 5Z" fill="#9ece6a"/>
    <text x="277.4" y="46.5" class="mono" font-size="12.5" letter-spacing=".6" fill="#9ece6a">CPCRETRODEV 2022</text>
    <text x="24" y="110" class="sans" font-size="27" font-weight="700" fill="#c0caf5">Geometry Escape</text>
    <text x="24" y="136" class="mono" font-size="14" fill="#737aa2">Amstrad CPC · gameplay &amp; graphics</text>
    <text x="24" y="172" class="sans" font-size="16.5" fill="#a9b1d6">Arcade escape game for the 1984 Amstrad CPC,</text><text x="24" y="197" class="sans" font-size="16.5" fill="#a9b1d6">written in Z80 assembly for a 4 MHz CPU</text><text x="24" y="222" class="sans" font-size="16.5" fill="#a9b1d6">and 64 KB of RAM. Runs on real hardware.</text>
    <rect x="24.0" y="238" width="125.6" height="28" rx="14" fill="#c0caf5" fill-opacity=".04" stroke="#292e42"/><circle cx="38.0" cy="252" r="4.5" fill="#e0af68"/><text x="48.0" y="256.5" class="mono" font-size="13" fill="#a9b1d6">Z80 assembly</text><rect x="157.6" y="238" width="102.2" height="28" rx="14" fill="#c0caf5" fill-opacity=".04" stroke="#292e42"/><circle cx="171.6" cy="252" r="4.5" fill="#7dcfff"/><text x="181.6" y="256.5" class="mono" font-size="13" fill="#a9b1d6">CPCtelera</text><rect x="267.8" y="238" width="102.2" height="28" rx="14" fill="#c0caf5" fill-opacity=".04" stroke="#292e42"/><circle cx="281.8" cy="252" r="4.5" fill="#f7768e"/><text x="291.8" y="256.5" class="mono" font-size="13" fill="#a9b1d6">Pixel art</text>
  </g>
  <rect x=".5" y=".5" width="439" height="279" rx="13.5" fill="none" stroke="#292e42"/>
</svg>
